# docker compose do projeto DrinkDex
# sobe todos os servicos com um unico comando: docker compose up --build
#
# a ordem importa — os bancos sobem primeiro, depois os servicos node,
# e por ultimo o frontend. o healthcheck garante que o proximo so sobe
# quando o anterior estiver realmente pronto (nao so "iniciado")

version: '3.8'

services:

  # banco relacional — usado pelo user-service
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: drinkdex
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data  # persiste os dados entre reinicios
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d drinkdex"]
      interval: 5s
      timeout: 5s
      retries: 15

  # banco de documentos — usado pelo drink-service
  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 15

  # banco em memoria — usado pelo activity-service pra rankings e favoritos
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 15

  # banco de grafos — usado pelo recommendation-service
  # a porta 7474 é a interface web do neo4j (otimo pra mostrar o grafo na apresentacao)
  # a porta 7687 é o protocolo bolt usado pelo driver node
  neo4j:
    image: neo4j:5-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/drinkdex123
      NEO4J_PLUGINS: '[]'
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

  # servico de usuarios (node + postgresql)
  user-service:
    build: ./servicos/servico-usuarios
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://admin:admin123@postgres:5432/drinkdex
      PORT: 3001
      JWT_SECRET: drinkdex_jwt_secret_2024
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure  # reinicia automatico se der crash na inicializacao

  # servico de drinks (node + mongodb)
  drink-service:
    build: ./servicos/servico-drinks
    ports:
      - "3002:3002"
    environment:
      MONGO_URL: mongodb://mongodb:27017/drinkdex
      RECOMMENDATION_URL: http://recommendation-service:3004
      PORT: 3002
    depends_on:
      mongodb:
        condition: service_healthy
    restart: on-failure

  # servico de atividades (node + redis)
  activity-service:
    build: ./servicos/servico-atividades
    ports:
      - "3003:3003"
    environment:
      REDIS_URL: redis://redis:6379
      PORT: 3003
    depends_on:
      redis:
        condition: service_healthy
    restart: on-failure

  # servico de recomendacoes (node + neo4j)
  # recomenda drinks similares baseado em ingredientes compartilhados
  recommendation-service:
    build: ./servicos/servico-recomendacoes
    ports:
      - "3004:3004"
    environment:
      NEO4J_URL: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: drinkdex123
      DRINK_SERVICE_URL: http://drink-service:3002
      PORT: 3004
    depends_on:
      neo4j:
        condition: service_healthy
      drink-service:
        condition: service_started
    restart: on-failure

  # frontend estatico servido pelo nginx
  # o js do browser chama os servicos direto pelo localhost
  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - user-service
      - drink-service
      - activity-service
      - recommendation-service

volumes:
  postgres_data:
  mongo_data:
  neo4j_data:
